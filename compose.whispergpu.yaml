# Whisper på NVIDIA-skjermkort (mye raskere enn på prosessoren).
# Krever NVIDIA-driver og NVIDIA Container Toolkit på maskinen:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
services:
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
