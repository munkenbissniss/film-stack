# =============================================================================
#  Film-stack – automatisk mediaserver på Docker (Linux, macOS, Windows)
#  Jellyfin (standard) eller Plex – velges i veiviseren (profil jellyfin eller plex).
#
#  1) docker compose run --rm setup     ← veiviser, lager .env (kjøres én gang)
#  2) docker compose up -d              ← starter alt
#  3) docker compose logs -f autoconfig ← se at alt settes opp automatisk
#
#  Alle ${...} hentes fra .env. Overstyringsfiler (compose.*.yaml) velges av
#  veiviseren via COMPOSE_FILE i .env.
# =============================================================================
name: film-stack

x-env: &env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Europe/Oslo}

x-svc: &svc
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    init:
      condition: service_completed_successfully

x-tool: &tool
  image: python:3.13-alpine
  restart: "no"
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  # ---------------------------------------------------------------------------
  # Engangsjobber
  # ---------------------------------------------------------------------------
  setup:                 # Veiviser:  docker compose run --rm setup
    <<: *tool
    profiles: ["setup"]
    network_mode: host
    stdin_open: true
    tty: true
    working_dir: /stack
    command: ["python", "-u", "/stack/tools/setup.py"]
    volumes:
      - ./:/stack
      - /var/run/docker.sock:/var/run/docker.sock

  init:                  # Lager mapper og riktige rettigheter før noe annet starter
    <<: *tool
    command: ["python", "-u", "/stack/tools/init.py"]
    environment:
      <<: *env
      MOVIES_DIR: ${MOVIES_DIR:-}
      TV_DIR: ${TV_DIR:-}
    volumes:
      - ./tools:/stack/tools:ro
      - ./homepage:/stack/homepage:ro
      - ${CONFIG_ROOT:-./config}:/config
      - ${DATA_ROOT:-./media}:/data

  autoconfig:            # Setter opp og kobler sammen alle appene via API-ene deres
    <<: *tool
    command: ["python", "-u", "/stack/tools/autoconfig.py"]
    depends_on:
      init:
        condition: service_completed_successfully
      plex: {condition: service_started, required: false}
      jellyfin: {condition: service_started, required: false}
      sonarr: {condition: service_started}
      radarr: {condition: service_started}
      prowlarr: {condition: service_started}
      bazarr: {condition: service_started}
      whisper: {condition: service_started, required: false}
      seerr: {condition: service_started}
      tautulli: {condition: service_started, required: false}
      recyclarr: {condition: service_started}
      homepage: {condition: service_started}
      nzbget: {condition: service_started, required: false}
    environment: &acenv
      <<: *env
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MEDIA_SERVER: ${MEDIA_SERVER:-jellyfin}
      JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin:8096}
      METADATA_LANGUAGE: ${METADATA_LANGUAGE:-no}
      METADATA_COUNTRY: ${METADATA_COUNTRY:-NO}
      PLEX_ACCOUNT_TOKEN: ${PLEX_ACCOUNT_TOKEN:-}
      PLEX_INTERNAL_URL: ${PLEX_INTERNAL_URL:-http://plex:32400}
      PLEX_HOST_MODE: ${PLEX_HOST_MODE:-0}
      HWACCEL: ${HWACCEL:-0}
      LAN_IP: ${LAN_IP:-}
      DASHBOARD_HOST: ${DASHBOARD_HOST:-localhost}
      QBIT_HOST: ${QBIT_HOST:-gluetun}
      MOVIES_DIR: ${MOVIES_DIR:-}
      TV_DIR: ${TV_DIR:-}
      LIBRARY_LANGUAGE: ${LIBRARY_LANGUAGE:-en-US}
      SUBTITLE_LANGS: ${SUBTITLE_LANGS:-no,en}
      RECYCLARR_SONARR_TEMPLATE: ${RECYCLARR_SONARR_TEMPLATE:-web-1080p}
      RECYCLARR_RADARR_TEMPLATE: ${RECYCLARR_RADARR_TEMPLATE:-hd-bluray-web}
      MIN_RESOLUTION: ${MIN_RESOLUTION:-1080}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      USENET_HOST: ${USENET_HOST:-}
      USENET_PORT: ${USENET_PORT:-563}
      USENET_USER: ${USENET_USER:-}
      USENET_PASSWORD: ${USENET_PASSWORD:-}
      USENET_CONNECTIONS: ${USENET_CONNECTIONS:-30}
      WHISPER: ${WHISPER:-av}
      WHISPER_URL: ${WHISPER_URL:-http://whisper:9000}
      WHISPER_MODEL: ${WHISPER_MODEL:-turbo}
      WHISPER_AUTO: ${WHISPER_AUTO:-0}
    volumes:
      - ./tools:/stack/tools:ro
      - ${CONFIG_ROOT:-./config}:/config
      - ${DATA_ROOT:-./media}:/data:ro
      - /var/run/docker.sock:/var/run/docker.sock

  sjekk:                 # Tester at alt virker:  docker compose run --rm sjekk
    <<: *tool
    profiles: ["sjekk"]
    command: ["python", "-u", "/stack/tools/sjekk.py"]
    environment: *acenv
    volumes:
      - ./tools:/stack/tools:ro
      - ${CONFIG_ROOT:-./config}:/config
      - ${DATA_ROOT:-./media}:/data
      - /var/run/docker.sock:/var/run/docker.sock

  # ---------------------------------------------------------------------------
  # Mediaserver: Jellyfin (gratis, åpen kildekode) eller Plex
  # ---------------------------------------------------------------------------
  jellyfin:
    <<: *svc
    profiles: ["jellyfin"]
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *env
      JELLYFIN_PublishedServerUrl: http://${LAN_IP:-localhost}:8096
    volumes:
      - ${CONFIG_ROOT:-./config}/jellyfin:/config
      - ${DATA_ROOT:-./media}:/data
    ports:
      - 8096:8096
      - 7359:7359/udp      # lar appene finne serveren på hjemmenettet

  plex:
    <<: *svc
    profiles: ["plex"]
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      <<: *env
      VERSION: docker
    volumes:
      - ${CONFIG_ROOT:-./config}/plex:/config
      - ${CONFIG_ROOT:-./config}/plex-transcode:/transcode
      - ${DATA_ROOT:-./media}:/data
    ports:
      - 32400:32400

  # ---------------------------------------------------------------------------
  # Nedlasting bak VPN (gluetun = killswitch for qBittorrent)
  # ---------------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-Europe/Oslo}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-protonvpn}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
    healthcheck:           # første oppstart tar tid (blokklister, MTU) – gi den rom
      start_period: 90s
      interval: 15s
      timeout: 10s
      retries: 4
    volumes:
      - ${CONFIG_ROOT:-./config}/gluetun:/gluetun
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      init:
        condition: service_completed_successfully
      gluetun:
        condition: service_started   # trygt: gluetuns brannmur slipper ingenting ut før VPN-en er oppe
    environment:
      <<: *env
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - ${CONFIG_ROOT:-./config}/qbittorrent:/config
      - ${DATA_ROOT:-./media}:/data

  nzbget:                # Usenet-nedlasting (slås på i veiviseren). Trenger ikke VPN – bruker SSL.
    <<: *svc
    profiles: ["usenet"]
    image: nzbgetcom/nzbget:latest
    container_name: nzbget
    environment:
      <<: *env
      NZBGET_USER: ${ADMIN_USER:-nzbget}
      NZBGET_PASS: ${ADMIN_PASSWORD:-tegbzn6789}
    volumes:
      - ${CONFIG_ROOT:-./config}/nzbget:/config
      - ${DATA_ROOT:-./media}:/data
    ports:
      - 6789:6789

  # ---------------------------------------------------------------------------
  # Indeksere og *arr
  # ---------------------------------------------------------------------------
  prowlarr:
    <<: *svc
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment: *env
    volumes:
      - ${CONFIG_ROOT:-./config}/prowlarr:/config
    ports:
      - 9696:9696

  flaresolverr:
    <<: *svc
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      TZ: ${TZ:-Europe/Oslo}
      LOG_LEVEL: info
    ports:
      - 8191:8191

  sonarr:
    <<: *svc
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment: *env
    volumes:
      - ${CONFIG_ROOT:-./config}/sonarr:/config
      - ${DATA_ROOT:-./media}:/data
    ports:
      - 8989:8989

  radarr:
    <<: *svc
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment: *env
    volumes:
      - ${CONFIG_ROOT:-./config}/radarr:/config
      - ${DATA_ROOT:-./media}:/data
    ports:
      - 7878:7878

  bazarr:
    <<: *svc
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment: *env
    volumes:
      - ${CONFIG_ROOT:-./config}/bazarr:/config
      - ${DATA_ROOT:-./media}:/data
    ports:
      - 6767:6767

  whisper:               # AI-undertekster: lytter på lydsporet og skriver teksten (brukes av Bazarr)
    <<: *svc
    profiles: ["whisper"]
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-turbo}
      ASR_MODEL_PATH: /models
      MODEL_IDLE_TIMEOUT: 300          # slipper minnet når den har vært ledig i 5 minutter
      TZ: ${TZ:-Europe/Oslo}
    volumes:
      - ${CONFIG_ROOT:-./config}/whisper:/models
    ports:
      - 9000:9000

  recyclarr:             # TRaSH Guides-profiler, synker hver natt
    <<: *svc
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      TZ: ${TZ:-Europe/Oslo}
      CRON_SCHEDULE: "@daily"
    volumes:
      - ${CONFIG_ROOT:-./config}/recyclarr:/config

  prefetcharr:           # Henter neste episoder når noen ser en serie
    <<: *svc
    image: phueber/prefetcharr:latest
    container_name: prefetcharr
    user: ${PUID:-1000}:${PGID:-1000}
    volumes:
      - ${CONFIG_ROOT:-./config}/prefetcharr/config.toml:/config:ro
      - ${CONFIG_ROOT:-./config}/prefetcharr/log:/log

  # ---------------------------------------------------------------------------
  # Forespørsler, statistikk og dashboard
  # ---------------------------------------------------------------------------
  seerr:
    <<: *svc
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      TZ: ${TZ:-Europe/Oslo}
      LOG_LEVEL: info
    volumes:
      - ${CONFIG_ROOT:-./config}/seerr:/app/config
    ports:
      - 5055:5055

  tautulli:              # Statistikk for Plex (Jellyfin har dette innebygd)
    <<: *svc
    profiles: ["plex"]
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment: *env
    volumes:
      - ${CONFIG_ROOT:-./config}/tautulli:/config
    ports:
      - 8181:8181

  homepage:
    <<: *svc
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      TZ: ${TZ:-Europe/Oslo}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-*}
    volumes:
      - ${CONFIG_ROOT:-./config}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT:-./media}:/mediadisk:ro
    ports:
      - 3000:3000

  throttle:              # Kontrollpanel og kjøling: status, innstillinger og løsninger på http://<server>:3010
    <<: *svc
    image: python:3.13-alpine
    container_name: throttle
    command: ["python", "-u", "/stack/tools/throttle.py"]
    environment:
      <<: *acenv
      COMPOSE_PROJECT_NAME: film-stack
      HOT_TEMP: ${HOT_TEMP:-85}          # °C – roe ned over dette
      COOL_TEMP: ${COOL_TEMP:-72}        # °C – normal igjen under dette
      HIGH_LOAD: ${HIGH_LOAD:-90}        # % prosessor i 2 min – roe ned
      LOW_LOAD: ${LOW_LOAD:-50}          # % prosessor i 5 min – normal igjen
      CALM_CPUS: ${CALM_CPUS:-0.3}       # prosessorgrense per bakgrunnsapp når den er rolig
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}   # bare for å sladde den i loggpakken
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
    volumes:
      - ./tools:/stack/tools:ro
      - ./VERSION:/stack/VERSION:ro
      - ${CONFIG_ROOT:-./config}:/config
      - ${DATA_ROOT:-./media}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 3010:3010

  # ---------------------------------------------------------------------------
  # Valgfrie (slås på i veiviseren via COMPOSE_PROFILES)
  # ---------------------------------------------------------------------------
  wizarr:
    <<: *svc
    profiles: ["wizarr"]
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: wizarr
    environment:
      TZ: ${TZ:-Europe/Oslo}
    volumes:
      - ${CONFIG_ROOT:-./config}/wizarr:/data/database
    ports:
      - 5690:5690

  autobrr:
    <<: *svc
    profiles: ["autobrr"]
    image: ghcr.io/autobrr/autobrr:latest
    container_name: autobrr
    environment: *env
    volumes:
      - ${CONFIG_ROOT:-./config}/autobrr:/config
    ports:
      - 7474:7474
