# Whisper på en annen maskin med NVIDIA-skjermkort, f.eks. en stasjonær PC.
# Kopier denne mappa dit og kjør:   docker compose up -d
# Velg så «En annen maskin» i veiviseren til Film-stack, med adressen http://<maskinens-IP>:9000
#
# Krever NVIDIA-driver og NVIDIA Container Toolkit:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
# Modellen slippes fra skjermkortet etter 5 minutter uten jobb, så andre programmer får plass.
name: whisper
services:
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    container_name: whisper
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-turbo}
      ASR_MODEL_PATH: /models
      MODEL_IDLE_TIMEOUT: 300
    volumes:
      - ./models:/models
    ports:
      - 9000:9000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
